                      proc=subprocess.Popen(args+["app-server","--listen","stdio://","-c","features.daemon_auto_start=false"],cwd=cwd,env=env,
                          stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=err,text=True,encoding="utf-8")
                      def reader():
