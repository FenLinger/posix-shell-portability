                          assert len(matches)==1 and Path(matches[0]["path"]).resolve()==skill.resolve()
                          print(json.dumps({"schema":"native-catalog/1","control":"actual_native_skill_discovery","outcome":"passed","skill":matches[0],"authentication":"isolated profile; no model turn attempted"}),flush=True)
                      finally:
                          inventory_error=None;forced_owner=False
                          try:
                              for attempt in range(2):
                                  snapshot=owned_windows_processes(proc.pid)
                                  owned=list({(p["ProcessId"],p["created"]):p for p in owned+snapshot}.values())
