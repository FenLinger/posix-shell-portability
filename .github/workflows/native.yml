          def owned_windows_processes(parent):
              if os.name!="nt":return []
              command="$ErrorActionPreference='Stop'; Get-CimInstance Win32_Process | Select-Object ProcessId,ParentProcessId,Name,@{n='created';e={if($_.CreationDate){$_.CreationDate.ToUniversalTime().ToString('o')}else{$null}}} | ConvertTo-Json -Compress"
              r=subprocess.run(["powershell.exe","-NoProfile","-NonInteractive","-Command",command],capture_output=True,encoding="utf-8",timeout=30)
              if r.returncode:raise RuntimeError("Could not inventory owned native descendants")
              rows=json.loads(r.stdout)
              if not isinstance(rows,list):raise RuntimeError("Invalid native process inventory")
              found={parent};owned=[]
              while True:
                  new=[p for p in rows if p["ParentProcessId"] in found and p["ProcessId"] not in found]
                  if not new:return owned
                  if any(not isinstance(p.get("created"),str) or not p["created"] or not isinstance(p.get("Name"),str) for p in new):
                      raise RuntimeError("Owned native descendant identity is unavailable")
                  owned+=new;found.update(p["ProcessId"] for p in new)
          
          def cleanup_owned_windows_processes(owned):
              # PID plus creation time protects against PID reuse. Never target arbitrary Git processes.
              time.sleep(2)
              for p in owned:
                  pid=int(p["ProcessId"]);created=p["created"]
                  command=f"$ErrorActionPreference='Stop'; $p=Get-CimInstance Win32_Process -Filter 'ProcessId={pid}'; if($p) {{if(-not $p.CreationDate) {{throw 'Owned helper identity unavailable'}}; if($p.CreationDate.ToUniversalTime().ToString('o') -eq '{created}') {{Stop-Process -Id {pid} -Force; Start-Sleep -Milliseconds 200; if(Get-Process -Id {pid} -ErrorAction SilentlyContinue) {{throw 'Owned helper survived cleanup'}}; Write-Output 'terminated-owned-helper'}} else {{Write-Output 'PID-reused-original-helper-gone'}}}} else {{Write-Output 'already-exited'}}"
                  r=subprocess.run(["powershell.exe","-NoProfile","-NonInteractive","-Command",command],capture_output=True,encoding="utf-8",timeout=30)
                  if r.returncode:raise RuntimeError("Owned native helper cleanup failed")
                  print(json.dumps({"schema":"native-catalog/1","helper_pid":pid,"helper_name":p["Name"],"cleanup":r.stdout.strip() or "already-exited"}),flush=True)
          
          class BoundedDirectory(tempfile.TemporaryDirectory):
              def cleanup(self):
                  for attempt in range(40):
                      try:
                          super().cleanup();return
                      except PermissionError:
                          if attempt==39:raise
                          time.sleep(.25)
          
          def main():
