                  skill.write_text("---\nname: ci-control\ndescription: Synthetic read-only CI catalog control.\n---\nReport the word CI_CONTROL when explicitly requested.\n",encoding="utf-8",newline="\n")
                  env={**os.environ,"CODEX_HOME":str(profile),"PYTHONUTF8":"1","PYTHONIOENCODING":"utf-8"}
