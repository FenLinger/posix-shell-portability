name: Native shell portability
on:
  push:
    branches: [ci-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Tests and host diagnostics
        run: python ci/probe.py
  persistence_guest:
    needs: probe
    # Experimental generic Linux guest diagnostics.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Same-guest lifecycle feasibility (synthetic data only)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          stage=preflight
          work=$(mktemp -d)
          uuid=$(cat /proc/sys/kernel/random/uuid)
          required=(image_verification guest_boot public_resolver parent_exit supervisor_restart guest_reboot_recovery explicit_stop_reboot)
          declare -A outcomes=()
          emit() { outcomes["$1"]=$2; printf '{"schema":"public-guest-lifecycle/1","control":"%s","outcome":"%s","scope":"diagnostics-only"}\n' "$1" "$2"; }
          cleanup() {
            rc=$?
            if [ -f "$work/qemu.pid" ]; then
              pid=$(sudo cat "$work/qemu.pid")
              if [[ "$pid" =~ ^[0-9]+$ ]] && sudo cat "/proc/$pid/cmdline" 2>/dev/null | tr '\0' ' ' | grep -Fq -- "$uuid"; then
                sudo kill "$pid" || true
              fi
            fi
            rm -rf "$work"
            if [ "$rc" -ne 0 ]; then emit "$stage" failed; fi
            for control in "${required[@]}"; do emit "$control" "${outcomes[$control]:-not-executed}"; done
            printf '{"schema":"public-guest-lifecycle/1","required_controls":7,"exit_code":%s,"scope":"diagnostics-only"}\n' "$rc"
          }
          trap cleanup EXIT
          test "$(uname -m)" = x86_64
          test -c /dev/kvm || { emit kvm unavailable; exit 1; }
          timeout 180 sudo apt-get update -qq
          timeout 180 sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils
          qemu-system-x86_64 --version
          base=https://cloud-images.ubuntu.com/releases/noble/release-20240423
          image=ubuntu-24.04-server-cloudimg-amd64.img
          stage=image_verification
          curl --location --fail --silent --show-error --max-time 30 "$base/SHA256SUMS" -o "$work/SHA256SUMS"
          curl --location --fail --silent --show-error --max-time 180 "$base/$image" -o "$work/$image"
          digest=$(awk -v f="*$image" '$2==f {print $1}' "$work/SHA256SUMS")
          expected_digest=32a9d30d18803da72f5936cf2b7b9efcb4d0bb63c67933f17e3bdfd1751de3f3
          image_bytes=$(stat -c %s "$work/$image")
          actual_digest=$(sha256sum "$work/$image" | awk '{print $1}')
          printf 'Image verification: bytes=%s expected=%s checksum_list=%s downloaded=%s\n' "$image_bytes" "$expected_digest" "$digest" "$actual_digest"
          test "$digest" = "$expected_digest" || { emit checksum_list failed; exit 1; }
          test "$actual_digest" = "$expected_digest" || { emit image_digest failed; exit 1; }
          emit image_verification passed
          ssh-keygen -q -t ed25519 -N '' -f "$work/key"
          printf '#cloud-config\nusers:\n  - name: ubuntu\n    groups: sudo\n    shell: /bin/bash\n    sudo: ALL=(ALL) NOPASSWD:ALL\n    ssh_authorized_keys:\n      - %s\nssh_pwauth: false\ndisable_root: true\n' "$(cat "$work/key.pub")" > "$work/user-data"
          printf 'instance-id: %s\nlocal-hostname: ci-persistence-guest\n' "$uuid" > "$work/meta-data"
          cloud-localds "$work/seed.img" "$work/user-data" "$work/meta-data"
          qemu-img create -q -f qcow2 -F qcow2 -b "$work/$image" "$work/disk.qcow2" 8G
          stage=guest_boot
          sudo qemu-system-x86_64 -enable-kvm -cpu host -smp 2 -m 2048 -uuid "$uuid" \
            -drive "file=$work/disk.qcow2,format=qcow2,if=virtio" -drive "file=$work/seed.img,format=raw,if=virtio" \
            -netdev user,id=n1,hostfwd=tcp:127.0.0.1:2222-:22 -device virtio-net-pci,netdev=n1 \
            -display none -serial "file:$work/serial.log" -daemonize -pidfile "$work/qemu.pid"
          ssh_opts=(-i "$work/key" -p 2222 -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$work/known_hosts")
          guest() { timeout 30 ssh "${ssh_opts[@]}" ubuntu@127.0.0.1 "set -e; $*"; }
          ready() { for i in $(seq 1 90); do if guest true 2>/dev/null; then return; fi; sleep 2; done; return 1; }
          ready
          guest 'sudo cloud-init status --wait >/dev/null; test "$(. /etc/os-release; echo "$VERSION_ID")" = 24.04; test "$(uname -m)" = x86_64'
          emit guest_boot passed
          # Transfer the exact public tree, including the unchanged resolver/probe.
          tar -cf "$work/public.tar" .github/workflows/native.yml .gitignore README.md LICENSE LICENSING.md ci/probe.py viewer/tools/posix_shell.py viewer/tools/tests/_bash.py viewer/tools/tests/test_bash_resolver.py
          timeout 30 scp -q -i "$work/key" -P 2222 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$work/known_hosts" "$work/public.tar" ubuntu@127.0.0.1:public.tar
          stage=public_resolver
          guest 'mkdir public; tar -xf public.tar -C public; cd public; PYTHONUTF8=1 python3 ci/probe.py'
          emit public_resolver passed
          stage=service_setup
          guest 'bash -se' <<'GUEST'
          set -euo pipefail
          mkdir -p ~/.config/systemd/user ~/lifecycle
          cat > ~/lifecycle/worker.py <<'WORKER'
          import os, pathlib, time
          path = pathlib.Path.home() / "lifecycle/checkpoint"
          count = int(path.read_text(encoding="utf-8")) if path.exists() else 0
          (path.parent / "loaded-count").write_text(str(count), encoding="utf-8", newline="\n")
          while True:
              count += 1
              with open(str(path) + ".tmp", "w", encoding="utf-8", newline="\n") as f:
                  f.write(str(count)); f.flush(); os.fsync(f.fileno())
              os.replace(str(path) + ".tmp", path)
              time.sleep(1)
          WORKER
          cat > ~/.config/systemd/user/ci-heartbeat.service <<'UNIT'
          [Unit]
          Description=Synthetic CI heartbeat
          [Service]
          ExecStart=/usr/bin/python3 %h/lifecycle/worker.py
          Restart=always
          RestartSec=1
          [Install]
          WantedBy=default.target
          UNIT
          cat /proc/sys/kernel/random/uuid > ~/lifecycle/disk-token
          sudo loginctl enable-linger ubuntu
          systemctl --user daemon-reload
          echo $$ > ~/lifecycle/launcher.pid
          systemctl --user enable --now ci-heartbeat.service
          GUEST
          snapshot() {
            guest 'printf "%s %s %s %s %s %s %s %s %s %s\n" "$(cat /proc/sys/kernel/random/boot_id)" "$(cat /etc/machine-id)" "$(sudo cat /sys/class/dmi/id/product_uuid)" "$(id -un):$(id -u)" "$(cat ~/lifecycle/disk-token)" "$(cat ~/lifecycle/checkpoint)" "$(systemctl --user show -p MainPID --value ci-heartbeat.service)" "$(systemctl --user is-enabled ci-heartbeat.service || true)" "$(systemctl --user is-active ci-heartbeat.service || true)" "$(cat ~/lifecycle/loaded-count)"'
          }
          record_state() { printf '{"schema":"public-guest-lifecycle/1","phase":"%s","boot":"%s","machine":"%s","vm":"%s","user":"%s","disk_token":"%s","checkpoint":%s,"pid":%s,"enabled":"%s","active":"%s","loaded_count":%s}\n' "$1" "$b" "$m" "$v" "$u" "$d" "$c" "$p" "$e" "$a" "$loaded"; }
          advance() { for i in $(seq 1 30); do read -r b m v u d c p e a loaded < <(snapshot); if [[ "$c" =~ ^[0-9]+$ ]] && (( c > $1 )) && [ "$a" = active ]; then return; fi; sleep 1; done; return 1; }
          stage=parent_exit
          advance 0
          initial=$c
          guest 'test ! -e /proc/$(cat ~/lifecycle/launcher.pid); test "$(loginctl show-user ubuntu -p Linger --value)" = yes'
          advance "$initial"
          record_state parent_exit
          emit parent_exit passed
          stage=supervisor_restart
          oldpid=$p; initial=$c
          guest 'systemctl --user kill --kill-whom=main --signal=SIGKILL ci-heartbeat.service'
          advance "$initial"
          test "$p" != "$oldpid"; test "$p" -gt 0
          test "$loaded" -ge "$initial"
          record_state supervisor_restart
          emit supervisor_restart passed
          oldboot=$b; machine=$m; vm=$v; user=$u; disk=$d; initial=$c
          reboot_guest() {
            guest 'sudo systemctl reboot' >/dev/null 2>&1 || true
            for i in $(seq 1 90); do
              if state=$(snapshot 2>/dev/null); then
                read -r b m v u d c p e a loaded <<< "$state"
                if [ "$b" != "$oldboot" ]; then
                  test "$m $v $u $d" = "$machine $vm $user $disk"; return
                fi
              fi
              sleep 2
            done
            return 1
          }
          stage=guest_reboot_recovery
          record_state before_reboot
          reboot_guest
          test "$e" = enabled
          advance "$initial"
          test "$loaded" -ge "$initial"
          record_state after_reboot
          emit guest_reboot_recovery passed
          stage=explicit_stop_reboot
          guest 'systemctl --user disable --now ci-heartbeat.service'
          read -r b m v u d c p e a loaded < <(snapshot)
          oldboot=$b; stopped=$c
          reboot_guest
          test "$e" = disabled; test "$a" = inactive; test "$p" = 0; test "$c" = "$stopped"
          sleep 5
          read -r b m v u d c p e a loaded < <(snapshot)
          test "$e" = disabled; test "$a" = inactive; test "$p" = 0; test "$c" = "$stopped"
          record_state explicit_stop_reboot
          emit explicit_stop_reboot passed
          emit experiment passed
          printf '%s\n' 'Generic guest diagnostics only; excludes application authentication, trust acceptance, Windows logon, Metal, outer-host reboot and cross-job persistence.' >> "$GITHUB_STEP_SUMMARY"

  hosted_native_controls:
    # Synthetic controls on native hosts for this job's lifetime only.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Native supervisor failure, durable stop and cleanup
        shell: bash
        run: |
          python - <<'HOST_PROBE'
          # SPDX-License-Identifier: AGPL-3.0-only
          """Synthetic hosted-job supervision controls; no private code or credentials."""
          import getpass
          import json
          import os
          from pathlib import Path
          import platform
          import plistlib
          import signal
          import subprocess
          import sys
          import tempfile
          import time
          import uuid
          
          REQUIRED = {"parent_exit", "checkpoint_reload", "supervisor_restart", "explicit_stop", "unregister_cleanup"}
          WORKER = '''import json, os, pathlib, sys, time, uuid
          root=pathlib.Path(sys.argv[1]); token=sys.argv[2]
          path=root/"checkpoint.json"
          invocation={"pid":os.getpid(),"token":token,"stop_observed":(root/"stop-intent").exists()}
          nonce=uuid.uuid4().hex
          with open(root/("invocation-"+nonce+".tmp"),"w",encoding="utf-8",newline="\\n") as f:
              json.dump(invocation,f); f.flush(); os.fsync(f.fileno())
          os.replace(root/("invocation-"+nonce+".tmp"),root/("invocation-"+nonce+".json"))
          if invocation["stop_observed"]: sys.exit(0)
          old=json.loads(path.read_text(encoding="utf-8")) if path.exists() else {"count":0}
          loaded=old["count"]; count=loaded
          while not (root/"stop-intent").exists():
              if (root/"crash-request").exists():
                  assert (root/"crash-request").read_text(encoding="utf-8")==token
                  (root/"crash-request").unlink()
                  with open(root/"failure-receipt.json","w",encoding="utf-8",newline="\\n") as f:
                      json.dump({"token":token,"pid":os.getpid(),"exit_code":23},f); f.flush(); os.fsync(f.fileno())
                  sys.exit(23)
              count+=1
              data={"count":count,"loaded":loaded,"pid":os.getpid(),"token":token}
              with open(root/"checkpoint.tmp","w",encoding="utf-8",newline="\\n") as f:
                  json.dump(data,f); f.flush(); os.fsync(f.fileno())
              os.replace(root/"checkpoint.tmp",path)
              time.sleep(1)
          '''
          
          def run(args, check=True):
              r=subprocess.run(args,capture_output=True,encoding="utf-8",timeout=30,
                               env={**os.environ,"PYTHONUTF8":"1","PYTHONIOENCODING":"utf-8"})
              if check and r.returncode:
                  raise RuntimeError(f"Command failed {args}: {r.returncode}: {r.stdout} {r.stderr}")
              return r
          
          def ps(body, check=True):
              # The fixed task name and paths are supplied through environment variables.
              return run(["powershell.exe","-NoProfile","-NonInteractive","-Command",
                          "[Console]::OutputEncoding=[System.Text.UTF8Encoding]::new(); $ErrorActionPreference='Stop'; "+body],check)
          
          def main():
              system=platform.system()
              if system not in {"Darwin","Windows"}:
                  raise RuntimeError("Requires an actual macOS or Windows host")
              token=uuid.uuid4().hex; task="ci-host-control-"+token
              identity=f"{platform.node()}:{getpass.getuser()}:{token}"
              outcomes={}; registered=False; domain=None; rc=1
              with tempfile.TemporaryDirectory(prefix="ci lifecycle space ") as temp:
                  root=Path(temp); worker=root/"worker.py"; checkpoint=root/"checkpoint.json"
                  worker.write_text(WORKER,encoding="utf-8",newline="\n")
                  os.environ.update(CI_CONTROL_TASK=task,CI_CONTROL_PYTHON=sys.executable,
                                    CI_CONTROL_WORKER=str(worker),CI_CONTROL_ROOT=str(root),CI_CONTROL_TOKEN=token)
                  def emit(control,outcome="passed"):
                      outcomes[control]=outcome
                      print(json.dumps({"schema":"hosted-native-lifecycle/1","control":control,
                                        "outcome":outcome,"identity":identity},ensure_ascii=False),flush=True)
                  def state():
                      if not checkpoint.exists():return None
                      value=json.loads(checkpoint.read_text(encoding="utf-8"))
                      assert value["token"]==token
                      return value
                  def wait_state(predicate, timeout=180):
                      deadline=time.monotonic()+timeout
                      while time.monotonic()<deadline:
                          value=state()
                          if value and predicate(value):return value
                          time.sleep(1)
                      if system=="Windows":
                          diagnostic=ps("$t=Get-ScheduledTask -TaskName $env:CI_CONTROL_TASK; $i=Get-ScheduledTaskInfo -TaskName $env:CI_CONTROL_TASK; [pscustomobject]@{task_state=[string]$t.State;last_result=$i.LastTaskResult;last_run_time=[string]$i.LastRunTime;restart_count=$t.Settings.RestartCount;restart_interval=$t.Settings.RestartInterval} | ConvertTo-Json -Compress",False)
                          print(json.dumps({"failure_diagnostic":diagnostic.stdout,"worker_state":state(),"identity":identity}),flush=True)
                      raise RuntimeError("Worker observation deadline expired")
                  def snapshot(phase,value):
                      print(json.dumps({"schema":"hosted-native-lifecycle/1","phase":phase,
                          "identity":identity,"system":system,"release":platform.release(),
                          "machine":platform.machine(),"state":value},ensure_ascii=False),flush=True)
                  def restart():
                      if system=="Darwin":run(["launchctl","kickstart",domain+"/"+task])
                      else:ps("Start-ScheduledTask -TaskName $env:CI_CONTROL_TASK")
                  def unregister():
                      if system=="Darwin":
                          if run(["launchctl","print",domain+"/"+task],False).returncode==0:
                              run(["launchctl","bootout",domain+"/"+task])
                          assert run(["launchctl","print",domain+"/"+task],False).returncode!=0
                      else:
                          ps("if (Get-ScheduledTask -TaskName $env:CI_CONTROL_TASK -ErrorAction SilentlyContinue) {Stop-ScheduledTask -TaskName $env:CI_CONTROL_TASK; Unregister-ScheduledTask -TaskName $env:CI_CONTROL_TASK -Confirm:$false}; if (Get-ScheduledTask -TaskName $env:CI_CONTROL_TASK -ErrorAction SilentlyContinue) {throw 'Task still registered'}")
                  try:
                      if system=="Darwin":
                          uid=os.getuid()
                          domain=f"gui/{uid}" if run(["launchctl","print",f"gui/{uid}"],False).returncode==0 else f"user/{uid}"
                          plist=root/"agent.plist"
                          plist.write_bytes(plistlib.dumps({"Label":task,"ProgramArguments":[sys.executable,str(worker),str(root),token],
                              "RunAtLoad":True,"KeepAlive":{"SuccessfulExit":False},"ThrottleInterval":1,
                              "ProcessType":"Background","StandardOutPath":str(root/"worker.stdout"),"StandardErrorPath":str(root/"worker.stderr")}))
                          # This initiating launchctl process exits before worker advancement is asserted.
                          registered=True
                          launcher=subprocess.Popen(["launchctl","bootstrap",domain,str(plist)])
                          launcher_rc=launcher.wait(timeout=30);assert launcher_rc==0
                          registered=True
                          supervisor=run(["launchctl","print",domain+"/"+task]).stdout
                          print(json.dumps({"supervisor":"launchd","domain":domain,"identity":identity,"state":supervisor}),flush=True)
                      else:
                          registered=True
                          registration=ps('''$sid=[System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $action=New-ScheduledTaskAction -Execute $env:CI_CONTROL_PYTHON -Argument ('"'+$env:CI_CONTROL_WORKER+'" "'+$env:CI_CONTROL_ROOT+'" '+$env:CI_CONTROL_TOKEN)
          $principal=New-ScheduledTaskPrincipal -UserId $sid -LogonType Interactive -RunLevel Limited
          $trigger=New-ScheduledTaskTrigger -AtLogOn -User $sid
          $settings=New-ScheduledTaskSettingsSet -RestartCount 2 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit (New-TimeSpan -Minutes 10) -MultipleInstances IgnoreNew -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
          Register-ScheduledTask -TaskName $env:CI_CONTROL_TASK -Action $action -Principal $principal -Trigger $trigger -Settings $settings -Force | Out-Null
          Start-ScheduledTask -TaskName $env:CI_CONTROL_TASK
          $t=Get-ScheduledTask -TaskName $env:CI_CONTROL_TASK
          [pscustomobject]@{supervisor='TaskScheduler';user_sid=$sid;principal=$t.Principal.UserId;logon_type=[string]$t.Principal.LogonType;state=[string]$t.State;restart_count=$t.Settings.RestartCount;restart_interval=$t.Settings.RestartInterval} | ConvertTo-Json -Compress
          ''')
                          registered=True;print(registration.stdout.strip(),flush=True)
                          info=json.loads(registration.stdout)
                          assert info["logon_type"]=="Interactive" and info["restart_count"]==2
                      first=wait_state(lambda s:s["count"]>=2)
                      second=wait_state(lambda s:s["pid"]==first["pid"] and s["count"]>first["count"])
                      snapshot("after_launcher_exit",second);emit("parent_exit")
                      # Kill only the exact observed fixture process. Real supervisor owns resurrection.
                      if system=="Darwin":os.kill(second["pid"],signal.SIGKILL)
                      else:
                          # Task Scheduler receives an actual application failure status, rather
                          # than an external administrative termination/cancellation request.
                          (root/"crash-request").write_text(token,encoding="utf-8",newline="\n")
                          deadline=time.monotonic()+30
                          while not (root/"failure-receipt.json").exists() and time.monotonic()<deadline:time.sleep(.25)
                          failed=json.loads((root/"failure-receipt.json").read_text(encoding="utf-8"))
                          assert failed=={"token":token,"pid":second["pid"],"exit_code":23}
                          ps(f"$deadline=(Get-Date).AddSeconds(15); while((Get-Process -Id {second['pid']} -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) {{Start-Sleep -Milliseconds 200}}; if(Get-Process -Id {second['pid']} -ErrorAction SilentlyContinue) {{throw 'Failed worker did not exit'}}")
                          snapshot("actual_application_failure",failed)
                          diagnostic=ps("$t=Get-ScheduledTask -TaskName $env:CI_CONTROL_TASK; $i=Get-ScheduledTaskInfo -TaskName $env:CI_CONTROL_TASK; [pscustomobject]@{task_state=[string]$t.State;last_result=$i.LastTaskResult;last_run_time=[string]$i.LastRunTime;restart_count=$t.Settings.RestartCount;restart_interval=$t.Settings.RestartInterval} | ConvertTo-Json -Compress")
                          print(json.dumps({"failure_diagnostic":diagnostic.stdout,"failure_injection":"application_exit23","identity":identity}),flush=True)
                      automatic=True
                      try:
                          recovered=wait_state(lambda s:s["pid"]!=second["pid"] and s["loaded"]>=second["count"] and s["count"]>second["count"])
                      except RuntimeError:
                          if system!="Windows":raise
                          automatic=False;emit("supervisor_restart","failed")
                          restart()
                          recovered=wait_state(lambda s:s["pid"]!=second["pid"] and s["loaded"]>=second["count"] and s["count"]>second["count"],timeout=30)
                      snapshot("after_worker_failure" if automatic else "manual_recovery_after_auto_failure",recovered)
                      emit("checkpoint_reload")
                      if automatic:emit("supervisor_restart")
                      (root/"stop-intent").write_text(token,encoding="utf-8",newline="\n")
                      time.sleep(4); stopped=state()
                      before_invocations={p.name for p in root.glob("invocation-*.json")}
                      restart()
                      deadline=time.monotonic()+30;stop_receipt=None
                      while time.monotonic()<deadline:
                          for p in root.glob("invocation-*.json"):
                              if p.name not in before_invocations:
                                  value=json.loads(p.read_text(encoding="utf-8"))
                                  assert value["token"]==token
                                  if value["stop_observed"]:stop_receipt=value
                          if stop_receipt:break
                          time.sleep(1)
                      assert stop_receipt, "No actual supervised invocation observed durable stop intent"
                      time.sleep(3)
                      if system=="Darwin":
                          assert run(["kill","-0",str(stop_receipt["pid"])],False).returncode!=0
                      else:
                          ps(f"if(Get-Process -Id {stop_receipt['pid']} -ErrorAction SilentlyContinue) {{throw 'Stopped invocation still alive'}}")
                      snapshot("actual_stopped_invocation",stop_receipt)
                      assert state()==stopped, "Durable stop intent failed on a subsequent supervised start"
                      snapshot("after_explicit_stop_and_restart",stopped);emit("explicit_stop")
                      unregister();registered=False
                      if system=="Darwin":
                          assert run(["kill","-0",str(recovered["pid"])],False).returncode!=0
                      else:
                          ps(f"if(Get-Process -Id {recovered['pid']} -ErrorAction SilentlyContinue) {{throw 'Worker still alive'}}")
                      emit("unregister_cleanup");rc=0 if set(outcomes)==REQUIRED and all(v=="passed" for v in outcomes.values()) else 1
                  finally:
                      if registered:
                          try:unregister()
                          except Exception as error:
                              rc=1
                              print(json.dumps({"cleanup_error":str(error),"identity":identity}),flush=True)
                      print(json.dumps({"schema":"hosted-native-lifecycle/1","summary":True,"identity":identity,
                          "required_controls":len(REQUIRED),"exit_code":rc,
                          "outcomes":{c:outcomes.get(c,"not-observed") for c in sorted(REQUIRED)},
                          "limitations":["hosted job lifetime only","no host reboot or new Windows logon","synthetic worker, not private harness","no persistent protected-host acceptance"]}),flush=True)
                  if rc:raise RuntimeError("Lifecycle probe failed")
          
          if __name__=="__main__":main()
          HOST_PROBE
      - name: Install exact native Codex CLI (no account credentials)
        if: always()
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-cli-control" --no-audit --no-fund @openai/codex@0.159.0-alpha.3
      - name: Actual native skill catalog and clean server close
        if: always()
        shell: bash
        run: |
          python - "$RUNNER_TEMP/codex-cli-control/node_modules/@openai/codex/bin/codex.js" <<'CATALOG_PROBE'
          # SPDX-License-Identifier: AGPL-3.0-only
          """Actual native catalog discovery with a fresh unauthenticated local profile."""
          import json
          import os
          from pathlib import Path
          import queue
          import subprocess
          import sys
          import tempfile
          import threading
